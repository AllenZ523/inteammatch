<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ★ 修改点 1：网页标题（浏览器标签上显示的） -->
  <title>=78D13=联队文档中心</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg: #080808;
      --bg-1: #101010;
      --panel: rgba(20,17,12,.86);
      --border: #8a6b26;
      --gold: #d9a941;
      --gold-2: #f7d67a;
      --steel: #b9bfc7;
      --text: #e8e6e6;
      --shadow: rgba(0,0,0,.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(1100px 500px at 20% -10%, rgba(217,169,65,.09), transparent),
        radial-gradient(900px 500px at 90% 10%, rgba(90,65,18,.16), transparent),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg) 60%);
      background-attachment: fixed;
    }

    .shell {
      width: min(1380px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 60px;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .topbar, .content, .sidebar {
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(5px);
      box-shadow: 0 12px 38px var(--shadow);
      clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 18px;
      background: linear-gradient(90deg, rgba(16,16,16,.94), rgba(30,24,18,.78));
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .crest, .section-crest {
      width: 58px;
      height: 58px;
      overflow: hidden;
      border: 1px solid rgba(217,169,65,.55);
      background: rgba(217,169,65,.08);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      flex: none;
    }

    .crest img, .section-crest img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .crest-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
    }

    .kicker {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .topbar h1 {
      margin: 3px 0 0;
      color: #fff;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .status {
      border: 1px solid rgba(217,169,65,.45);
      background: rgba(217,169,65,.08);
      color: var(--gold-2);
      padding: 7px 11px;
      font-size: 12px;
    }

    .sidebar {
      position: sticky;
      top: 20px;
      margin-top: 22px;
      padding: 18px 14px;
    }

    .sidebar-title {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .sidebar-title + .sidebar-nav { margin-bottom: 18px; }

    .sidebar-nav { display: grid; gap: 7px; }

    .sidebar-nav a {
      display: block;
      color: var(--text);
      text-decoration: none;
      padding: 10px;
      border-left: 3px solid rgba(217,169,65,.25);
      background: rgba(255,255,255,.02);
      font-size: 13px;
      transition: .18s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-nav a.active, .sidebar-nav a:hover {
      color: #fff;
      border-left-color: var(--gold);
      background: rgba(217,169,65,.1);
    }

    .content { margin-top: 22px; }

    .content-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(217,169,65,.35);
      background: linear-gradient(90deg, rgba(217,169,65,.13), transparent 55%);
    }

    .content-head h2 {
      margin: 0;
      color: #fff;
      font-size: 18px;
      letter-spacing: 2px;
    }
    /* ★ 新增：内容区标题左侧容器 */
    .content-head-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    /* ★ 新增：返回文档中心按钮 */
    .back-home {
      display: inline-flex;
      align-items: center;
      color: var(--gold);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid rgba(217,169,65,.4);
      background: rgba(217,169,65,.06);
      white-space: nowrap;
      transition: .18s;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }

    .back-home:hover {
      color: #fff;
      border-color: var(--gold);
      background: rgba(217,169,65,.18);
    }
    .doc-meta { color: var(--steel); font-size: 12px; }

    .match-section + .match-section {
      border-top: 1px solid rgba(217,169,65,.3);
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 30px 14px;
      border-bottom: 1px solid rgba(217,169,65,.25);
      background: linear-gradient(90deg, rgba(217,169,65,.1), transparent 60%);
    }

    .section-kicker {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
    }

    .section-title h2 {
      margin: 4px 0 0;
      color: #fff;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .section-panel { padding: 24px 30px 34px; }
    #loading, #error, #empty-tip { padding: 34px 24px; color: var(--gold-2); text-align: center; }
    #error { color: #f0a18a; }

    .markdown-body {
      color: var(--text);
      background: transparent;
      font-size: 15px;
      line-height: 1.75;
    }

    .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: var(--gold-2); }

    .markdown-body code {
      color: var(--gold-2);
      background: rgba(217,169,65,.11);
      border: 1px solid rgba(217,169,65,.25);
    }

    .markdown-body table tr { background: transparent; }
    .markdown-body table th { color: var(--gold-2); background: rgba(217,169,65,.11); }
    .katex { color: #fff; }
    /* ★ 新增：首页文档卡片 */
    .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    padding: 22px 24px 32px;
    }

    .home-card {
    display: block;
    padding: 18px 18px 20px;
    border: 1px solid rgba(217,169,65,.35);
    background: linear-gradient(160deg, rgba(217,169,65,.08), rgba(217,169,65,.02));
    color: var(--text);
    text-decoration: none;
    transition: .18s;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    }

    .home-card:hover {
    border-color: var(--gold);
    background: linear-gradient(160deg, rgba(217,169,65,.18), rgba(217,169,65,.05));
    transform: translateY(-2px);
    }

    .home-card-title {
    color: #fff;
    font-size: 16px;
    margin-bottom: 8px;
    letter-spacing: .5px;
    }

    .home-card-desc {
    color: var(--steel);
    font-size: 13px;
    margin-bottom: 10px;
    }

    .home-card-file {
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 1px;
    }
    .footer-line {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      color: rgba(185,191,199,.72);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .footer-line::before, .footer-line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(217,169,65,.4), transparent);
    }

    /* ★ 新增：移动端固定顶部文件栏（默认桌面端隐藏） */
    .mobile-file-bar {
      display: none;
    }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; width: min(100% - 18px, 1380px); padding-top: 18px; }
      .sidebar { position: static; order: 2; }
      .section-head { padding: 18px 18px 12px; }
      .section-panel { padding: 20px 18px 28px; }
      .topbar h1 { font-size: 18px; }
      .status { display: none; }

      /* 移动端隐藏侧边栏里的“文件列表”，交给顶部固定栏显示 */
      .sidebar > .sidebar-title:first-child,
      .sidebar > #doc-nav {
        display: none;
      }

      /* 顶部固定文件栏 */
      .mobile-file-bar {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        padding: 10px 12px;
        background: linear-gradient(180deg, rgba(16,13,8,.98), rgba(20,17,12,.94));
        border-bottom: 1px solid var(--border);
        box-shadow: 0 6px 22px rgba(0,0,0,.55);
        backdrop-filter: blur(10px);
        transform: translateY(-110%);
        transition: transform .28s cubic-bezier(.4,0,.2,1);
      }

      .mobile-file-bar.visible {
        transform: translateY(0);
      }

      .mobile-doc-nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .mobile-doc-nav::-webkit-scrollbar { display: none; }

      .mobile-doc-nav a {
        flex: none;
        display: inline-block;
        color: var(--text);
        text-decoration: none;
        padding: 8px 12px;
        border: 1px solid rgba(217,169,65,.3);
        background: rgba(255,255,255,.03);
        font-size: 13px;
        white-space: nowrap;
        transition: .18s;
      }

      .mobile-doc-nav a.active,
      .mobile-doc-nav a:active {
        color: #fff;
        border-color: var(--gold);
        background: rgba(217,169,65,.18);
      }
    }
    @media (max-width: 860px){
      .content-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .content-head-left {
        width: 100%;
        flex-wrap: wrap;
      }
      .back-home {
        font-size: 12px;
        padding: 5px 9px;
      }
      .content-head h2 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- ★ 新增：移动端顶部固定文件栏，由 JS 根据滚动方向控制显示 -->
  <div class="mobile-file-bar" id="mobile-file-bar">
    <nav id="mobile-doc-nav" class="mobile-doc-nav"></nav>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="crest"><img id="top-crest" src="icon.jpg" alt="78D13 队徽"></div>
        <div>
          <div class="kicker">War Thunder · Tactical Operations</div>
          <!-- ★ 修改点 2：顶部大标题初始文字。JS 会用当前文档标题覆盖，这里只是兜底。 -->
          <h1 id="top-title">78D13 文档中心</h1>
        </div>
      </div>
      <div class="status">RULES ONLINE</div>
    </header>

    <aside class="sidebar">
      <!-- ★ 修改点 3：这里是文档切换区，会自动生成；标题文字可改。移动端此块会被隐藏，改用顶部固定栏。 -->
      <div class="sidebar-title">文件列表</div>
      <nav id="doc-nav" class="sidebar-nav"></nav>

      <div class="sidebar-title">当前部分</div>
      <nav id="nav" class="sidebar-nav"></nav>
    </aside>

    <main class="content">
  <!-- ★ 新增：首页视图（文档中心） -->
  <div id="home-view">
    <div class="content-head">
      <h2>文档中心</h2>
      <div class="doc-meta">请选择要浏览的文档</div>
    </div>
    <div class="home-grid" id="home-grid"></div>
  </div>

  <!-- ★ 新增：文档视图（原来的内容包起来） -->
  <div id="doc-view" hidden>
    <div class="content-head">
      <div class="content-head-left">
        <!-- ★ 新增：返回文档中心按钮 -->
        <a href="./" class="back-home">← 返回文档中心</a>
        <h2 id="head-title">文档正文</h2>
      </div>
    <div class="doc-meta" id="doc-meta">SOURCE / -</div>
    </div>
    <div id="loading">正在加载文档…</div>
    <div id="error" hidden></div>
    <article id="doc" class="markdown-body" hidden></article>
  </div>
  </main>

    <!-- ★ 修改点 5：底部标语，随意改 -->
    <div class="footer-line">78D13 COMBAT REGULATIONS</div>
  </div>

  <script>
    /* ★ 修改点 6（最重要）：文档映射表
       每一项代表一个 Markdown 文档：
       - 键名会出现在 URL 的 ?doc= 后面
       - file：实际 Markdown 文件名，必须和服务器上的完全一致
       - title：顶部大标题、移动端文件栏按钮文字
       - head：内容区左上角的条令名
       想加文档？照抄一项改名字即可。
    */
    const DOC_MAP = {
      match: {
        file: '队内赛规则.md',
        title: '78D13 队内赛规则',
        head: '作战条令'
      },
      monitor: {
        file: '裁判用.md',
        title: '78D13 比赛裁判用文档',
        head: '裁判条令'
      },
      to_moneyer: {
        file: '赞助规则.md',
        title: '78D13 比赛赞助规则',
        head: '赞助规则'
      },
      when_cut_money_by_monitor: {
        file: '裁判组一般奖金分配原则.md',
        title: '78D13 裁判组一般奖金分配原则',
        head: '裁判组一般奖金分配原则'
      },
      things_give_MVP_and_captions: {
        file: '队长及比赛MVP奖励机制.md',
        title: '78D13 队长及MVP奖励机制',
        head: 'MVP奖励机制'
      }
    };

    // ★ 修改点 7：队徽路径。所有页面共用一张图。
    const crestSource = 'icon.jpg';

    const markdownEl = document.getElementById('doc');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const navEl = document.getElementById('nav');
    const docNavEl = document.getElementById('doc-nav');
    const mobileDocNavEl = document.getElementById('mobile-doc-nav');
    const mobileBarEl = document.getElementById('mobile-file-bar');
    const topTitleEl = document.getElementById('top-title');
    const headTitleEl = document.getElementById('head-title');
    const docMetaEl = document.getElementById('doc-meta');
    const homeView = document.getElementById('home-view');
    const docView = document.getElementById('doc-view');

    marked.use({ breaks: true, gfm: true });

    // 从 URL 读取 ?doc=xxx，没写就用 DOC_MAP 里第一个
    const keys = Object.keys(DOC_MAP);
    const currentKey = new URLSearchParams(location.search).get('doc'); // ★ 可能为 null
    const cfg = currentKey ? DOC_MAP[currentKey] : null;                // ★ 首页时为 null
    function renderError(msg) {
      loadingEl.hidden = true;
      errorEl.hidden = false;
      errorEl.textContent = msg || '规则文件加载失败。请通过 HTTP 服务打开本页面。';
    }

    function renderMath() {
      renderMathInElement(markdownEl, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false
      });
    }

    function applyCrestFallback(image) {
      image.addEventListener('error', () => {
        const placeholder = document.createElement('div');
        placeholder.className = 'crest-placeholder';
        placeholder.textContent = '队徽';
        image.replaceWith(placeholder);
      });
    }

    function makeCrest() {
      const crest = document.createElement('div');
      crest.className = 'section-crest';
      const image = document.createElement('img');
      image.src = crestSource;
      image.alt = '队徽';
      image.loading = 'lazy';
      applyCrestFallback(image);
      crest.appendChild(image);
      return crest;
    }

    // 生成左侧“文档切换”列表 + 移动端顶部文件栏
    function renderDocNav(activeKey) {
      [docNavEl, mobileDocNavEl].forEach(container => {
        if (!container) return;
        container.innerHTML = '';
        keys.forEach(k => {
          const a = document.createElement('a');
          a.href = `?doc=${encodeURIComponent(k)}`;
          a.textContent = DOC_MAP[k].title;
          if (k === activeKey) a.classList.add('active');
          container.appendChild(a);
        });
      });
    }
    // ★ 新增：生成首页文档卡片
    function renderHome() {
      const homeGrid = document.getElementById('home-grid');
      if (!homeGrid) return;
      homeGrid.innerHTML = '';

      keys.forEach(k => {
        const c = DOC_MAP[k];
        const card = document.createElement('a');
        card.className = 'home-card';
        card.href = `?doc=${encodeURIComponent(k)}`;
        card.innerHTML = `
          <div class="home-card-title">${c.title}</div>
          <div class="home-card-desc">${c.head || ''}</div>
          <div class="home-card-file">${c.file}</div>
      `;
      homeGrid.appendChild(card);
      });
      // ★ 新增：首页隐藏移动端顶部文件栏
      if (mobileBarEl) mobileBarEl.classList.remove('visible');
      // ★ 新增：首页隐藏侧边栏“当前部分”
      const sidebarTitles = document.querySelectorAll('.sidebar-title');
      if (sidebarTitles.length) sidebarTitles[sidebarTitles.length - 1].style.display = 'none';
      navEl.style.display = 'none';
    }
    
    // 把 Markdown 渲染结果按 <h1> 拆分成多个 section，并生成章节导航
    function buildProvisions() {
      navEl.innerHTML = '';
      const headings = Array.from(markdownEl.querySelectorAll('h1'));
      const links = new Map();

      headings.forEach((heading, index) => {
        const section = document.createElement('section');
        section.className = 'match-section';
        const id = heading.id || `provision-${index + 1}`;
        const title = heading.textContent.trim();

        const head = document.createElement('div');
        head.className = 'section-head';
        const titleWrapper = document.createElement('div');
        titleWrapper.className = 'section-title';
        const kicker = document.createElement('div');
        kicker.className = 'section-kicker';
        kicker.textContent = `Provision ${String(index + 1).padStart(2, '0')}`;
        const headingOutput = document.createElement('h2');
        headingOutput.textContent = title;
        titleWrapper.append(kicker, headingOutput);
        head.append(makeCrest(), titleWrapper);

        const panel = document.createElement('div');
        panel.className = 'markdown-body section-panel';
        let node = heading.nextElementSibling;
        while (node) {
          const next = node.nextElementSibling;
          panel.appendChild(node);
          node = next;
        }
        heading.remove();

        section.id = id;
        section.append(head, panel);
        markdownEl.appendChild(section);

        const link = document.createElement('a');
        link.href = `#${id}`;
        link.textContent = title;
        navEl.appendChild(link);
        links.set(section, link);
      });

      if (headings.length === 0) {
        const tip = document.createElement('div');
        tip.textContent = '当前文档没有一级标题（# 开头），侧边栏章节为空。';
        tip.style.color = '#b9bfc7';
        tip.style.fontSize = '13px';
        navEl.appendChild(tip);
      }

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            links.forEach(link => link.classList.remove('active'));
            links.get(entry.target)?.classList.add('active');
          }
        });
      }, { rootMargin: '-18% 0px -70% 0px' });
      links.forEach((_, section) => observer.observe(section));
    }

    /* ★ 新增：移动端顶部文件栏的滚动显示/隐藏逻辑
       规则：
       - 页面在顶端附近（y <= 10）→ 始终显示
       - 向下滚动（手指上滑）且已超过栏高度 → 隐藏
       - 向上滚动（手指下滑）→ 显示
    */
    let lastScrollY = window.scrollY;

    function handleMobileBarScroll() {
      if (!mobileBarEl) return;

      // 桌面端不处理
      if (window.innerWidth > 860) {
        mobileBarEl.classList.remove('visible');
        return;
      }
      // ★ 新增：首页（文档中心）不显示顶部栏
      if (!document.getElementById('doc-view') || document.getElementById('doc-view').hidden) {
        mobileBarEl.classList.remove('visible');
        return;
      }

      const y = window.scrollY;
      const delta = y - lastScrollY;
      const barHeight = mobileBarEl.offsetHeight || 64;

      if (y <= 10) {
        // 回到顶部，始终显示
        mobileBarEl.classList.add('visible');
      } else if (delta > 4 && y > barHeight) {
        // 向下滚动，且滚出栏高度 → 隐藏
        mobileBarEl.classList.remove('visible');
      } else if (delta < -4) {
        // 向上滚动 → 显示
        mobileBarEl.classList.add('visible');
      }

      lastScrollY = y;
    }

    window.addEventListener('scroll', handleMobileBarScroll, { passive: true });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 860) {
        mobileBarEl.classList.remove('visible');
      } else if (docView && !docView.hidden) {
        mobileBarEl.classList.add('visible');
        lastScrollY = window.scrollY;
      }
    });

    async function loadDocument(key) {
      const cfg = DOC_MAP[key];
      if (!cfg) return;

      document.title = cfg.title;
      topTitleEl.textContent = cfg.title;
      headTitleEl.textContent = cfg.head || '文档正文';
      docMetaEl.textContent = `SOURCE / ${cfg.file}`;

      try {
        const response = await fetch(cfg.file, { cache: 'no-store' });
        if (!response.ok) throw new Error(response.statusText);
        const markdown = await response.text();
        markdownEl.innerHTML = marked.parse(markdown);
        buildProvisions();
        loadingEl.hidden = true;
        markdownEl.hidden = false;
        renderMath();
      } catch (err) {
        console.error(err);
        renderError(`无法加载 ${cfg.file}。请确认文件存在，且通过 HTTP 服务打开本页面。`);
      }
    }

    
    applyCrestFallback(document.getElementById('top-crest'));
    renderDocNav(currentKey); // currentKey 可能为 null，不高亮，正常

    if (currentKey && DOC_MAP[currentKey]) {
      // ★ 有 ?doc= → 进入文档视图
      homeView.hidden = true;
      docView.hidden = false;
      // ★ 新增：恢复侧边栏“当前部分”
      const sidebarTitles = document.querySelectorAll('.sidebar-title');
      if (sidebarTitles.length) sidebarTitles[sidebarTitles.length - 1].style.display = '';
      navEl.style.display = '';
      loadDocument(currentKey);
    } else {
      // ★ 无参数 → 进入首页（文档中心）
      homeView.hidden = false;
      docView.hidden = true;
      renderHome();
      document.title = '78D13 联队文档中心';
      topTitleEl.textContent = '78D13 文档中心';
    }

    // 移动端首次进入顶部栏显示（★ 修改：仅在文档视图显示）
    if (window.innerWidth <= 860 && currentKey && DOC_MAP[currentKey]) {
      mobileBarEl.classList.add('visible');
      lastScrollY = window.scrollY;
    }
  </script>
</body>
</html>
