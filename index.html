<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>78D13 战争雷霆 队内赛规则</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg: #080808;
      --bg-1: #101010;
      --panel: rgba(20,17,12,.86);
      --border: #8a6b26;
      --gold: #d9a941;
      --gold-2: #f7d67a;
      --steel: #b9bfc7;
      --text: #e8e6e6;
      --shadow: rgba(0,0,0,.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(1100px 500px at 20% -10%, rgba(217,169,65,.09), transparent),
        radial-gradient(900px 500px at 90% 10%, rgba(90,65,18,.16), transparent),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg) 60%);
      background-attachment: fixed;
    }

    .shell {
      width: min(1380px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 60px;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .topbar, .content, .sidebar {
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(5px);
      box-shadow: 0 12px 38px var(--shadow);
      clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 18px;
      background: linear-gradient(90deg, rgba(16,16,16,.94), rgba(30,24,18,.78));
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .crest, .section-crest {
      width: 58px;
      height: 58px;
      overflow: hidden;
      border: 1px solid rgba(217,169,65,.55);
      background: rgba(217,169,65,.08);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    }

    .crest img, .section-crest img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .crest-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
    }

    .kicker {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .topbar h1 {
      margin: 3px 0 0;
      color: #fff;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .status {
      border: 1px solid rgba(217,169,65,.45);
      background: rgba(217,169,65,.08);
      color: var(--gold-2);
      padding: 7px 11px;
      font-size: 12px;
    }

    .sidebar {
      position: sticky;
      top: 20px;
      margin-top: 22px;
      padding: 18px 14px;
    }

    .sidebar-title {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .sidebar-nav { display: grid; gap: 7px; }

    .sidebar-nav a {
      display: block;
      color: var(--text);
      text-decoration: none;
      padding: 10px;
      border-left: 3px solid rgba(217,169,65,.25);
      background: rgba(255,255,255,.02);
      font-size: 13px;
      transition: .18s;
    }

    .sidebar-nav a.active, .sidebar-nav a:hover {
      color: #fff;
      border-left-color: var(--gold);
      background: rgba(217,169,65,.1);
    }

    .content { margin-top: 22px; }

    .content-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(217,169,65,.35);
      background: linear-gradient(90deg, rgba(217,169,65,.13), transparent 55%);
    }

    .content-head h2 {
      margin: 0;
      color: #fff;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .doc-meta { color: var(--steel); font-size: 12px; }

    .match-section + .match-section {
      border-top: 1px solid rgba(217,169,65,.3);
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 30px 14px;
      border-bottom: 1px solid rgba(217,169,65,.25);
      background: linear-gradient(90deg, rgba(217,169,65,.1), transparent 60%);
    }

    .section-kicker {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
    }

    .section-title h2 {
      margin: 4px 0 0;
      color: #fff;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .section-panel { padding: 24px 30px 34px; }
    #loading, #error { padding: 34px 24px; color: var(--gold-2); text-align: center; }
    #error { color: #f0a18a; }

    .markdown-body {
      color: var(--text);
      background: transparent;
      font-size: 15px;
      line-height: 1.75;
    }

    .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: var(--gold-2); }

    .markdown-body code {
      color: var(--gold-2);
      background: rgba(217,169,65,.11);
      border: 1px solid rgba(217,169,65,.25);
    }

    .markdown-body table tr { background: transparent; }
    .markdown-body table th { color: var(--gold-2); background: rgba(217,169,65,.11); }
    .katex { color: #fff; }

    .footer-line {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      color: rgba(185,191,199,.72);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .footer-line::before, .footer-line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(217,169,65,.4), transparent);
    }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; width: min(100% - 18px, 1380px); padding-top: 18px; }
      .sidebar { position: static; order: 2; }
      .section-head { padding: 18px 18px 12px; }
      .section-panel { padding: 20px 18px 28px; }
      .topbar h1 { font-size: 18px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="crest"><img id="top-crest" src="icon.jpg" alt="78D13 队徽"></div>
        <div>
          <div class="kicker">War Thunder · Tactical Operations</div>
          <h1>78D13 队内赛规则</h1>
        </div>
      </div>
      <div class="status">RULES ONLINE</div>
    </header>

    <aside class="sidebar">
      <div class="sidebar-title">NAVIGATION</div>
      <nav id="nav" class="sidebar-nav"></nav>
    </aside>

    <main class="content">
      <div class="content-head">
        <h2>作战条令</h2>
        <div class="doc-meta">SOURCE / 队内赛规则.md</div>
      </div>
      <div id="loading">正在加载规则文件…</div>
      <div id="error" hidden></div>
      <article id="doc" class="markdown-body" hidden></article>
    </main>

    <div class="footer-line">78D13 COMBAT REGULATIONS</div>
  </div>

  <script>
    const markdownEl = document.getElementById('doc');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const navEl = document.getElementById('nav');
    const crestSource = 'icon.jpg';

    marked.use({ breaks: true, gfm: true });

    function renderError() {
      loadingEl.hidden = true;
      errorEl.hidden = false;
      errorEl.textContent = '规则文件加载失败。请通过本地 HTTP 服务打开本页面。';
    }

    function renderMath() {
      renderMathInElement(markdownEl, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false
      });
    }

    function applyCrestFallback(image) {
      image.addEventListener('error', () => {
        const placeholder = document.createElement('div');
        placeholder.className = 'crest-placeholder';
        placeholder.textContent = '队徽';
        image.replaceWith(placeholder);
      });
    }

    function makeCrest() {
      const crest = document.createElement('div');
      crest.className = 'section-crest';
      const image = document.createElement('img');
      image.src = crestSource;
      image.alt = '队徽';
      image.loading = 'lazy';
      applyCrestFallback(image);
      crest.appendChild(image);
      return crest;
    }

    function buildProvisions() {
      const headings = Array.from(markdownEl.querySelectorAll('h1'));
      const links = new Map();

      headings.forEach((heading, index) => {
        const section = document.createElement('section');
        section.className = 'match-section';
        const id = heading.id || `provision-${index + 1}`;
        const title = heading.textContent.trim();

        const head = document.createElement('div');
        head.className = 'section-head';
        const titleWrapper = document.createElement('div');
        titleWrapper.className = 'section-title';
        const kicker = document.createElement('div');
        kicker.className = 'section-kicker';
        kicker.textContent = `Provision ${String(index + 1).padStart(2, '0')}`;
        const headingOutput = document.createElement('h2');
        headingOutput.textContent = title;
        titleWrapper.append(kicker, headingOutput);
        head.append(makeCrest(), titleWrapper);

        const panel = document.createElement('div');
        panel.className = 'markdown-body section-panel';
        let node = heading.nextElementSibling;
        while (node) {
          const next = node.nextElementSibling;
          panel.appendChild(node);
          node = next;
        }
        heading.remove();

        section.id = id;
        section.append(head, panel);
        markdownEl.appendChild(section);

        const link = document.createElement('a');
        link.href = `#${id}`;
        link.textContent = title;
        navEl.appendChild(link);
        links.set(section, link);
      });

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            links.forEach(link => link.classList.remove('active'));
            links.get(entry.target)?.classList.add('active');
          }
        });
      }, { rootMargin: '-18% 0px -70% 0px' });
      links.forEach((_, section) => observer.observe(section));
    }

    async function loadRules() {
      try {
        const response = await fetch('队内赛规则.md', { cache: 'no-store' });
        if (!response.ok) throw new Error(response.statusText);
        const markdown = await response.text();
        markdownEl.innerHTML = marked.parse(markdown);
        buildProvisions();
        loadingEl.hidden = true;
        markdownEl.hidden = false;
        renderMath();
      } catch (err) {
        console.error(err);
        renderError();
      }
    }

    applyCrestFallback(document.getElementById('top-crest'));
    loadRules();
  </script>
</body>
</html>
